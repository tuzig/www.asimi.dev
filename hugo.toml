baseURL = 'https://asimi.dev/'
languageCode = 'en-us'
title = 'Asimi CLI'
enableRobotsTXT = true

[params]
  tagline = 'An imperial court for your project'
  description = 'Asimi is a coding agent that anointes you a ruler over a sandboxed imperial court — where your intent becomes law, ministers execute your will, and you reign over a purposeful court'
  github = 'https://github.com/afittestide/asimi-cli'
  og_image = 'og-image.png'
  
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    style = 'dracula'
    lineNos = false

[taxonomies]
  tag = 'tags'
  category = 'categories'

[permalinks]
  blog = '/blog/:slug/'
