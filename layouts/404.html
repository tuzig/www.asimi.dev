<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 - Page Not Found | {{ .Site.Title }}</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  
  <style>
    /* Terminal7 Color Scheme from Asimi */
    :root {
      --prompt-border: #F952F9;
      --chat-border: #F4DB53;
      --text-color: #01FAFA;
      --pane-background: #000000;
      --dark-border: #373702;
      --bg-primary: #000000;
      --text-primary: #f1f5f9;
      --text-secondary: #a0a0a0;
      --gradient-1: linear-gradient(135deg, #F952F9 0%, #01FAFA 50%, #F4DB53 100%);
      --shadow-glow: 0 0 60px rgba(249, 82, 249, 0.2);
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --font-mono: 'JetBrains Mono', 'Fira Code', monospace;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: var(--font-sans);
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }

    .error-container {
      max-width: 500px;
    }

    .error-code {
      font-family: var(--font-mono);
      font-size: 8rem;
      font-weight: 700;
      background: var(--gradient-1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1;
      margin-bottom: 1rem;
    }

    h1 {
      font-size: 1.5rem;
      margin-bottom: 1rem;
      color: var(--text-color);
    }

    p {
      color: var(--text-secondary);
      margin-bottom: 2rem;
    }

    .home-link {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem 1.5rem;
      background: var(--prompt-border);
      color: var(--bg-primary);
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
      transition: all 0.2s;
    }

    .home-link:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-glow);
    }
  </style>
</head>
<body>
  <div class="error-container">
    <div class="error-code">404</div>
    <h1>Page Not Found</h1>
    <p>The page you're looking for doesn't exist or has been moved.</p>
    <a href="/" class="home-link">← Back to Home</a>
  </div>
</body>
</html>
