<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ .Title }} - {{ .Site.Title }}</title>
  <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Summary | truncate 160 }}{{ end }}">
  
  <!-- Open Graph -->
  <meta property="og:title" content="{{ .Title }}">
  <meta property="og:description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Summary | truncate 160 }}{{ end }}">
  <meta property="og:type" content="article">
  <meta property="og:url" content="{{ .Permalink }}">
  <meta property="article:published_time" content="{{ .Date.Format "2006-01-02T15:04:05Z07:00" }}">
  <meta property="og:image" content="{{ .Site.BaseURL }}{{ with .Params.og_image }}{{ . }}{{ else }}{{ .Site.Params.og_image }}{{ end }}">
  
  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ .Title }}">
  <meta name="twitter:description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Summary | truncate 160 }}{{ end }}">
  <meta name="twitter:image" content="{{ .Site.BaseURL }}{{ with .Params.og_image }}{{ . }}{{ else }}{{ .Site.Params.og_image }}{{ end }}">
  
  <!-- Canonical -->
  <link rel="canonical" href="{{ .Permalink }}">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  
  <style>
    /* Terminal7 Color Scheme from Asimi */
    :root {
      --prompt-border: #F952F9;
      --chat-border: #F4DB53;
      --text-color: #01FAFA;
      --warning: #F4DB53;
      --error: #F54545;
      --prompt-background: #271D30;
      --pane-background: #000000;
      --dark-border: #373702;
      
      --bg-primary: #000000;
      --bg-secondary: #0a0a0a;
      --bg-card: #271D30;
      --text-primary: #f1f5f9;
      --text-secondary: #a0a0a0;
      --text-muted: #666666;
      --accent-primary: #01FAFA;
      --accent-secondary: #F952F9;
      --border-color: #373702;
      
      --gradient-hero: linear-gradient(135deg, #F952F9 0%, #01FAFA 100%);
      --gradient-1: linear-gradient(135deg, #F952F9 0%, #01FAFA 50%, #F4DB53 100%);
      --shadow-glow: 0 0 60px rgba(249, 82, 249, 0.2);
      
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --font-mono: 'JetBrains Mono', 'Fira Code', monospace;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      font-family: var(--font-sans);
      background: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.7;
    }

    nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      padding: 1rem 2rem;
      background: rgba(0, 0, 0, 0.9);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--dark-border);
    }

    .nav-container {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-family: var(--font-mono);
      font-size: 1.5rem;
      font-weight: 700;
      background: var(--gradient-hero);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-decoration: none;
    }

    .nav-links {
      display: flex;
      gap: 2rem;
      list-style: none;
    }

    .nav-links a {
      color: var(--text-secondary);
      text-decoration: none;
      font-weight: 500;
      transition: color 0.2s;
    }

    .nav-links a:hover { color: var(--text-color); }

    article {
      max-width: 750px;
      margin: 0 auto;
      padding: 8rem 2rem 4rem;
    }

    /* Wide tables - break out of container */
    .wide-table {
      width: 100vw;
      position: relative;
      left: 50%;
      margin-left: -50vw;
      overflow-x: auto;
      padding: 0 2rem;
    }

    .wide-table table {
      width: 100%;
      max-width: 1100px;
      margin: 1rem auto;
      border-collapse: collapse;
      font-size: 0.9rem;
    }

    .wide-table th, .wide-table td {
      padding: 0.5rem 0.75rem;
      border: 1px solid var(--dark-border);
      text-align: center;
    }

    .wide-table th {
      background: var(--bg-card);
      color: var(--text-color);
      font-weight: 600;
    }

    .wide-table td:first-child, .wide-table td:nth-child(2) {
      text-align: left;
    }

    .wide-table tr:nth-child(even) {
      background: rgba(39, 29, 48, 0.3);
    }

    .article-header {
      margin-bottom: 3rem;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 0.9rem;
      margin-bottom: 2rem;
      transition: color 0.2s;
    }

    .back-link:hover { color: var(--text-color); }

    .article-date {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 0.75rem;
    }

    .article-title {
      font-size: clamp(2rem, 5vw, 2.75rem);
      font-weight: 700;
      line-height: 1.2;
      margin-bottom: 1rem;
      background: var(--gradient-1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .article-tags {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .tag {
      padding: 0.25rem 0.75rem;
      background: var(--bg-card);
      border: 1px solid var(--dark-border);
      border-radius: 100px;
      font-size: 0.8rem;
      color: var(--chat-border);
    }

    .article-content {
      font-size: 1.1rem;
    }

    .article-content h2 {
      font-size: 1.75rem;
      margin: 2.5rem 0 1rem;
      color: var(--text-color);
    }

    .article-content h3 {
      font-size: 1.35rem;
      margin: 2rem 0 0.75rem;
      color: var(--text-color);
    }

    .article-content p {
      margin-bottom: 1.5rem;
      color: var(--text-secondary);
    }

    .article-content a {
      color: var(--text-color);
      text-decoration: none;
      border-bottom: 1px dotted var(--text-color);
      transition: all 0.2s;
    }

    .article-content a:hover {
      color: var(--prompt-border);
      border-bottom-color: var(--prompt-border);
    }

    .article-content ul, .article-content ol {
      margin-bottom: 1.5rem;
      padding-left: 1.5rem;
      color: var(--text-secondary);
    }

    .article-content li {
      margin-bottom: 0.5rem;
    }

    .article-content code {
      font-family: var(--font-mono);
      font-size: 0.9em;
      background: var(--bg-card);
      padding: 0.2em 0.4em;
      border-radius: 4px;
      color: var(--chat-border);
    }

    .article-content pre {
      background: var(--pane-background);
      border: 1px solid var(--chat-border);
      border-radius: 8px;
      padding: 1.25rem;
      overflow-x: auto;
      margin-bottom: 1.5rem;
    }

    .article-content pre code {
      background: none;
      padding: 0;
      font-size: 0.9rem;
      color: var(--text-primary);
    }

    .article-content blockquote {
      border-left: 3px solid var(--prompt-border);
      padding-left: 1.5rem;
      margin: 1.5rem 0;
      color: var(--text-secondary);
      font-style: italic;
    }

    .article-content img {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
      margin: 1.5rem 0;
      border: 1px solid var(--dark-border);
    }

    .article-content strong {
      color: var(--text-primary);
    }

    .article-content em {
      color: var(--text-secondary);
    }

    .article-content hr {
      border: none;
      border-top: 1px solid var(--dark-border);
      margin: 2rem 0;
    }

    .article-footer {
      margin-top: 4rem;
      padding-top: 2rem;
      border-top: 1px solid var(--dark-border);
    }

    .share-section {
      text-align: center;
    }

    .share-section p {
      color: var(--text-muted);
      margin-bottom: 1rem;
    }

    .share-links {
      display: flex;
      justify-content: center;
      gap: 1rem;
    }

    .share-links a {
      padding: 0.5rem 1rem;
      background: var(--bg-card);
      border: 1px solid var(--dark-border);
      border-radius: 6px;
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 0.9rem;
      transition: all 0.2s;
    }

    .share-links a:hover {
      border-color: var(--prompt-border);
      color: var(--prompt-border);
    }

    footer {
      padding: 3rem 2rem;
      border-top: 1px solid var(--dark-border);
      text-align: center;
      color: var(--text-muted);
      font-size: 0.875rem;
    }

    footer a {
      color: var(--prompt-border);
      text-decoration: none;
    }

    @media (max-width: 768px) {
      .nav-links { display: none; }
      article { padding: 6rem 1.5rem 3rem; }
      .article-content { font-size: 1rem; }
    }
  </style>
</head>
<body>
  <nav>
    <div class="nav-container">
      <a href="/" class="logo">asimi</a>
      <ul class="nav-links">
        <li><a href="/#features">Features</a></li>
        <li><a href="/#install">Install</a></li>
        <li><a href="/#court">Court</a></li>
        <li><a href="/blog/">Blog</a></li>
        <li><a href="{{ .Site.Params.github }}" target="_blank" rel="noopener">GitHub</a></li>
      </ul>
    </div>
  </nav>

  <article>
    <header class="article-header">
      <a href="/blog/" class="back-link">← Back to Blog</a>
      <div class="article-date">{{ .Date.Format "January 2, 2006" }}{{ with .Params.author }} · By {{ . }}{{ end }}</div>
      <h1 class="article-title">{{ .Title }}</h1>
      {{ with .Params.tags }}
      <div class="article-tags">
        {{ range . }}
        <span class="tag">{{ . }}</span>
        {{ end }}
      </div>
      {{ end }}
    </header>

    <div class="article-content">
      {{ .Content }}
    </div>

  </article>

  {{ partial "footer.html" . }}
</body>
</html>
