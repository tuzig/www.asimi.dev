realms:
  - icon: "🧑"
    title: "人 Ren (Intent)"
    description: "Your intent, issues, and decisions. The will that drives all work."
    analogy: "The ruler issues and reviews edicts"
  - icon: "🌍"
    title: "地 Di (Earth)"
    description: "Source code, git commits, and the filesystem. Where work takes shape."
    analogy: "The ruler reviews completed work"
  - icon: "⚡"
    title: "天 Tian (Heaven)"
    description: "Tests, logs, CI verdicts — immutable truth. The final arbiter."
    analogy: "The ruler is briefed on status and incidents"

ministers:
  - name: "Chancellor (宰相)"
    description: "Coordinator — oversees the court and the rituals "
  - name: "Sage (孔子)"
    description: "Advisor + Censor — sees all, creates edicts, reviews code quality."
  - name: "Minister of War (兵部)"
    description: "Plans complex campaigns — creates battle plans for medium and large edicts."
  - name: "Forge (工部)"
    description: "Writes code — produces manifests with the implementation details."
  - name: "Judge (刑部)"
    description: "Runs tests, validates — renders the binary verdict: pass or fail."

principles:
  - term: "Zhengming (正名)"
    description: "Never guess; ask"
  - term: "仁 Ren"
    description: "Benevolence"
  - term: "义 Yi"
    description: "Righteousness"
  - term: "礼 Li"
    description: "Propriety"
  - term: "智 Zhi"
    description: "Wisdom"
  - term: "信 Xin"
    description: "Trustworthiness"
