- name: "Chancellor (宰相)"
  description: "Coordinator — oversees the court and the rituals "
- name: "Sage (孔子)"
  description: "Advisor + Censor — sees all, creates edicts, reviews code quality."
- name: "Minister of War (兵部)"
  description: "Plans complex campaigns — creates battle plans for medium and large edicts."
- name: "Forge (工部)"
  description: "Writes code — produces manifests with the implementation details."
- name: "Judge (刑部)"
  description: "Runs tests, validates — renders the binary verdict: pass or fail."
