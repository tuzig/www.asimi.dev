hero:
  headline_line1: "Become The Ruler"
  headline_line2: "of Your Projects"
  subheadline: "Asimi is an open-source, multi-model, single-daemon coding agent. It governs your projects by an imperial court so your codebase moves with intent, not chaos."
  primary_button: "Get Started →"
  secondary_button: "View on GitHub"

nav:
  logo: "asimi"
  toggle_label: "Toggle navigation"
  toggle_icon: "☰"
  links:
    - label: "Court"
      href: "#court"
    - label: "Features"
      href: "#features"
    - label: "Install"
      href: "#install"
    - label: "Blog"
      href: "#blog"

seal_chain:
  title: "The Seal Chain — Ascension"
  intro: "An edict ascends from Earth to Heaven through the seal chain:"
  items:
    - icon: "👩‍⚖️"
      title: "Judge's Seal"
      description: "no tests were changed and the change is well tested and the tests pass"
    - icon: "☯️"
      title: "Chancellor's Seal"
      description: "the code is simply using the right names and adheres to the Imperial Code"
    - icon: "🤴"
      title: "Ruler's Seal"
      description: "your final approval; the edict ascends to Heaven"

court:
  title: "The Court"

become_a_ruler:
  msgs:
    - "With Asimi you don't micromanage keystrokes; you rule"
    - "You state intent, and a small court of ministers defines Edicts (aka issues)"
    - "You review, sharpen and approve edicts to capture your will"
    - "You start rituals (aka workflows) that weave the agents and guardrails to implement edicts, init projects, etc."
  closing: ""

become_a_contributor:
  title: "Become a Contributor"
  intro: "Asimi is built in the open and grows by its contributors. Whether you write code, prose, or bug reports, there is a place for you in the court."
  items:
    - "Triage issues and reproduce bug reports from the borderlands."
    - "Write tests that let the Judge render a verdict with confidence."
    - "Improve the docs, the Ruler's Guide, and this very website."
    - "Forge new rituals, guardrails, and ministers for the court."
    - "Review pull requests and hold the Imperial Code."

realms:
  title: "The Three Realms (三界)"
  intro: "Asimi's one job is the continuous harmonization of the Three Realms"
  items:
    - icon: "🧑"
      title: "人 Ren (Intent and Will)"
      description: "Your wants, edicts, documents and tests. Intent is subjective and often ambiguous, so it is never obeyed blindly: the court raises 正名 and asks the ruler as guessing is treason."
      analogy: "The ruler states intent; the court rectifies names"
    - icon: "🌍"
      title: "地 Di (Earth)"
      description: "Production code, shaped by the Forge (工部) and maintained by git."
      analogy: "The Forge shapes the code"
    - icon: "⚡"
      title: "天 Tian (Heaven)"
      description: "Tests pass or fail; CI renders verdicts; logs record events. Heaven is immutable, binary, and absolute. It does not suggest, signal, or negotiate — it judges."
      analogy: "Asimi uses webhooks to listen and handle tian events"

ministers:
  title: "The Ministers"
  closing: "No minister is fully trusted — if the Forge fakes a test, the Judge catches it. No change reaches Heaven without passing every seal, including yours."
  list:
    - name: "Secretary (中書令)"
      description: "Receives your intent, rectifies names(正名), and drafts edicts."
    - name: "Chancellor (侍中)"
      description: "Advises, reviews code against the Imperial Code, and holds the Chancellor's Seal."
    - name: "Strategist (兵部)"
      description: "Plans complex campaigns — battle plans for medium and large epics, covering multiple edicts."
    - name: "Forge (工部)"
      description: "Writes clean concise code — produces manifests with the implementation details."
    - name: "Judge (刑部)"
      description: "Runs tests and renders the binary verdict: pass or fail."

principles:
  title: "Key Principles"
  items:
    - term: "Zhengming (正名)"
      description: "Never guess; ask"
    - term: "仁 Ren"
      description: "Benevolence"
    - term: "义 Yi"
      description: "Righteousness"
    - term: "礼 Li"
      description: "Propriety"
    - term: "智 Zhi"
      description: "Wisdom"
    - term: "信 Xin"
      description: "Trustworthiness"

court_guide:
  text: "Read the full guide →"
  href: "https://github.com/afittestide/asimi-cli/blob/main/RULER_GUIDE.md"

features:
  title: "Batteries Included"
  items:
    - icon: "🛠️"
      title: "DevOps Init"
      description: "An init command that creates:"
      bullets:
        - "A Justfile to hold the project's scripts"
        - "A Dockerfile to define the sandbox where the model's shell runs"
    - icon: "🎨"
      title: "Vi Mimicry"
      description: "Based on the fittest dev tool ever made. If you know ex/vi/vim/neovim, you already know Asimi."
    - icon: "🏝️"
      title: "Podman Sandboxes"
      description: "Agent's shell runs in its own container. Your host system stays protected while the models works freely."
    - icon: "🦙"
      title: "Multiple LLM Providers"
      description: "Support for Ollama, Claude Pro/Max, and OpenAI API v1 compatible services. Use your preferred model."
    - icon: "⚡"
      title: "30x+ Faster Shell"
      description: "Asimi's containerized consistent shell uses subshells to isolate commands. This minimizes overhead and save on slow exec times."
    - icon: "🧹"
      title: "Less Clutter"
      description_prefix: "All special files live under the"
      code: ".agents"
      description_suffix: "directory. TOML-based config keeps it clean and documented."

installation:
  title: "Installation"
  subtitle: "Get up and running in minutes"
  dependencies_title: "System Dependencies"
  dependencies_intro: "First, install these two great tools:"
  dependencies_tabs:
    - id: "dep-brew"
      label: "macOS"
      comment: "# macOS (Homebrew)"
      command: "brew install podman just"
      copy: "brew install podman just"
    - id: "dep-dnf"
      label: "Fedora / RHEL"
      comment: "# Fedora / RHEL"
      command: "sudo dnf install podman just"
      copy: "sudo dnf install podman just"
    - id: "dep-apt"
      label: "Debian / Ubuntu"
      comment: "# Debian / Ubuntu"
      command: "sudo apt update\nsudo apt install podman just"
      copy: "sudo apt update\nsudo apt install podman just"
  dependencies_separately: "Or install separately:"
  dependencies_links:
    - label: "Podman"
      href: "https://podman.io/docs/installation"
      suffix: "- like Docker but safer"
    - label: "Just"
      href: "https://github.com/casey/just"
      suffix: "- to collect all scripts in a Justfile"
  asimi_title: "Install Asimi"
  asimi_tabs:
    - id: "curl"
      label: "curl"
      comment: "# One-line installer"
      command: "curl -fsSL https://asimi.dev/installer | bash"
      copy: "curl -fsSL https://asimi.dev/installer | bash"
    - id: "brew"
      label: "Homebrew"
      comment: "# Add the tap and install"
      command: "brew tap afittestide/tap\nbrew install asimi"
      copy: "brew tap afittestide/tap\nbrew install asimi"
    - id: "go"
      label: "Go"
      comment: "# Install with Go 1.25+"
      command: "go install github.com/afittestide/asimi@latest"
      copy: "go install github.com/afittestide/asimi@latest"
    - id: "binary"
      label: "Binary"
      comment: "# Download from releases"
      href: "https://github.com/afittestide/asimi-cli/releases/latest"
      href_text: "github.com/afittestide/asimi-cli/releases/latest"
      comment_2: "# Copy to your bin directory"
      command: "cp asimi /usr/local/bin/\nchmod +x /usr/local/bin/asimi"
      copy: "cp asimi /usr/local/bin/\nchmod +x /usr/local/bin/asimi"
  copy_label: "Copy"
  copied_label: "Copied!"

